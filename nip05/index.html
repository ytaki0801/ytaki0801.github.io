<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Nostr Profile</title>

<style>

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    margin: 30px;

    background: #f5f5f5;

    color: #222;
}

.profile {
    max-width: 900px;

    margin: 0 auto;

    background: #fff;

    border: 1px solid #ddd;

    border-radius: 8px;

    padding: 20px;
}

.profile h1 {
    font-size: 24px;

    margin-top: 0;

    margin-bottom: 20px;
}

.profile-row {
    display: grid;

    grid-template-columns:
        140px 1fr;

    border-top: 1px solid #eee;

    padding: 10px 0;

    word-break: break-word;
}

.profile-key {
    font-weight: bold;

    color: #555;
}

.profile-value {
    color: #222;

    white-space: pre-wrap;
}

.profile-picture {
    max-width: 200px;

    max-height: 200px;

    border-radius: 8px;
}

.profile-banner {
    max-width: 100%;

    max-height: 300px;

    object-fit: cover;

    border-radius: 8px;
}

.error {
    max-width: 900px;

    margin: 30px auto;

    padding: 20px;

    background: #fff;

    border: 1px solid #d88;

    border-radius: 8px;

    color: #900;
}

.loading {
    max-width: 900px;

    margin: 30px auto;

    padding: 20px;

    background: #fff;

    border: 1px solid #ddd;

    border-radius: 8px;

    text-align: center;
}

@media (max-width: 600px) {

    body {
        margin: 10px;
    }

    .profile-row {
        grid-template-columns:
            1fr;
    }

    .profile-key {
        margin-bottom: 4px;
    }
}


.profile-banner-container{margin:-20px -20px 20px -20px}
.profile-banner{width:100%;height:240px;object-fit:cover;display:block;border-radius:8px 8px 0 0}
.profile-avatar-container{text-align:center;margin-top:-70px;margin-bottom:15px}
.profile-picture{width:140px;height:140px;border-radius:50%;object-fit:cover;border:5px solid white;background:white}
.profile-header{text-align:center;margin-bottom:25px}
.profile-display-name{font-size:1.8em;font-weight:bold}
.profile-name{color:#666;margin-top:4px}

</style>

</head>


<body>

<div id="app">

    <div class="loading">
        Loading Nostr profile...
    </div>

</div>


<script>


// ============================================================
// 設定
// ============================================================

const BOOTSTRAP_RELAYS = [

    "wss://relay.damus.io",

    "wss://nos.lol",

    "wss://relay.primal.net",

    "wss://relay.snort.social"

];

const TIMEOUT = 5000;


// ============================================================
// HTMLエスケープ
// ============================================================

function escapeHtml(value)
{
    const div =
        document.createElement("div");

    div.textContent =
        String(value);

    return div.innerHTML;
}


// ============================================================
// NIP-05正規化
// ============================================================

function normalizeNip05(value)
{
    value =
        value.trim();

    if (
        value.startsWith("https://")
    ) {

        value =
            value.substring(8);

    }
    else if (
        value.startsWith("http://")
    ) {

        value =
            value.substring(7);
    }

    value =
        value.replace(/\/+$/, "");

    if (
        !value.includes("@")
    ) {

        value =
            "_@" + value;
    }

    return value;
}


// ============================================================
// 表示用NIP-05
// ============================================================

function displayNip05(value)
{
    if (!value) {
        return "";
    }

    value =
        value.trim();

    if (
        value.startsWith("https://")
    ) {

        value =
            value.substring(8);
    }
    else if (
        value.startsWith("http://")
    ) {

        value =
            value.substring(7);
    }

    value =
        value.replace(/\/+$/, "");

    if (
        value.startsWith("_@")
    ) {

        return value.substring(2);
    }

    if (
        value.startsWith("@")
    ) {

        return value.substring(1);
    }

    return value;
}


// ============================================================
// NIP-05 → 公開鍵HEX
// ============================================================

async function nip05ToHexPubkey(nip05)
{
    nip05 =
        normalizeNip05(nip05);

    if (
        !nip05.includes("@")
    ) {

        throw new Error(
            "The specified value is not a valid NIP-05 identifier."
        );
    }

    let [
        name,
        domain
    ] =
        nip05.split("@", 2);

    if (
        name === ""
    ) {

        name = "_";
    }

    if (
        domain === ""
    ) {

        throw new Error(
            "No domain was specified."
        );
    }

    if (
        !/^[a-zA-Z0-9._-]+$/.test(name)
    ) {

        throw new Error(
            "The NIP-05 identifier contains invalid username characters."
        );
    }

    if (
        !/^[a-zA-Z0-9.-]+$/.test(domain)
    ) {

        throw new Error(
            "The domain format is invalid."
        );
    }

    const url =
        "https://" +
        domain +
        "/.well-known/nostr.json?name=" +
        encodeURIComponent(name);

    const response =
        await fetch(
            url,
            {
                method: "GET",
                cache: "no-cache"
            }
        );

    if (
        !response.ok
    ) {

        throw new Error(
            "NIP-05 information could not be retrieved."
        );
    }

    const data =
        await response.json();

    if (
        !data.names ||
        typeof data.names !== "object"
    ) {

        throw new Error(
            "The nostr.json response does not contain a names object."
        );
    }

    if (
        !data.names[name]
    ) {

        throw new Error(
            "The specified NIP-05 user was not found."
        );
    }

    const pubkey =
        data.names[name];

    if (
        typeof pubkey !== "string" ||
        !/^[0-9a-fA-F]{64}$/.test(pubkey)
    ) {

        throw new Error(
            "The public key is not a valid 64-character hexadecimal string."
        );
    }

    return {

        nip05: nip05,

        pubkey:
            pubkey.toLowerCase()

    };
}


// ============================================================
// HEX → Uint8Array
// ============================================================

function hexToBytes(hex)
{
    const result =
        new Uint8Array(
            hex.length / 2
        );

    for (
        let i = 0;
        i < hex.length;
        i += 2
    ) {

        result[i / 2] =
            parseInt(
                hex.substring(i, i + 2),
                16
            );
    }

    return result;
}


// ============================================================
// 8bit → 5bit
// ============================================================

function convertBits8to5(data)
{
    let accumulator = 0;

    let bits = 0;

    const result = [];

    for (
        const value of data
    ) {

        accumulator =
            (accumulator << 8) |
            value;

        bits += 8;

        while (
            bits >= 5
        ) {

            bits -= 5;

            result.push(
                (accumulator >> bits)
                & 31
            );
        }
    }

    if (
        bits > 0
    ) {

        result.push(
            (accumulator << (5 - bits))
            & 31
        );
    }

    return result;
}


// ============================================================
// Bech32 polymod
// ============================================================

function bech32Polymod(values)
{
    const generator = [
        0x3b6a57b2,
        0x26508e6d,
        0x1ea119fa,
        0x3d4233dd,
        0x2a1462b3
    ];

    let chk = 1;

    for (
        const value of values
    ) {

        const top =
            chk >>> 25;

        chk =
            (
                (chk & 0x1ffffff)
                << 5
            )
            ^
            value;

        for (
            let i = 0;
            i < 5;
            i++
        ) {

            if (
                (
                    top >> i
                )
                & 1
            ) {

                chk ^=
                    generator[i];
            }
        }
    }

    return chk >>> 0;
}


// ============================================================
// Bech32 HRP expand
// ============================================================

function bech32HrpExpand(hrp)
{
    const result = [];

    for (
        let i = 0;
        i < hrp.length;
        i++
    ) {

        result.push(
            hrp.charCodeAt(i)
            >> 5
        );
    }

    result.push(0);

    for (
        let i = 0;
        i < hrp.length;
        i++
    ) {

        result.push(
            hrp.charCodeAt(i)
            & 31
        );
    }

    return result;
}


// ============================================================
// HEX公開鍵 → npub
// ============================================================

function hexToNpub(hex)
{
    const data =
        hexToBytes(hex);

    const converted =
        convertBits8to5(data);

    const hrp =
        "npub";

    const values =
        bech32HrpExpand(hrp)
        .concat(converted)
        .concat([0, 0, 0, 0, 0, 0]);

    const polymod =
        bech32Polymod(values)
        ^ 1;

    const checksum = [];

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        const shift =
            5 * (5 - i);

        checksum.push(
            (polymod >> shift)
            & 31
        );
    }

    const charset =
        "qpzry9x8gf2tvdw0s3jn54khce6mua7l";

    let result =
        "npub1";

    for (
        const value
        of converted.concat(checksum)
    ) {

        result +=
            charset[value];
    }

    return result;
}


// ============================================================
// Nostr Relayからイベント取得
// ============================================================

function queryEvent(
    relayUrl,
    pubkeyHex,
    kind
)
{
    return new Promise(
        (resolve) => {

            let socket;
            let finished = false;
            const events = [];

            const subscriptionId =
                crypto.randomUUID();

            const timer =
                setTimeout(
                    () => {
                        finish();
                    },
                    TIMEOUT
                );

            function finish()
            {
                if (finished) {
                    return;
                }

                finished = true;
                clearTimeout(timer);

                try {
                    if (
                        socket &&
                        socket.readyState === WebSocket.OPEN
                    ) {
                        socket.close();
                    }
                }
                catch (e) {
                }

                if (events.length === 0) {
                    resolve(null);
                    return;
                }

                events.sort(
                    (a, b) =>
                        b.created_at - a.created_at
                );

                resolve(events[0]);
            }

            try {

                socket =
                    new WebSocket(
                        relayUrl
                    );

                socket.onopen =
                    () => {

                        const request = [
                            "REQ",
                            subscriptionId,
                            {
                                authors: [
                                    pubkeyHex
                                ],
                                kinds: [
                                    kind
                                ],
                                limit: 20
                            }
                        ];

                        socket.send(
                            JSON.stringify(
                                request
                            )
                        );
                    };

                socket.onmessage =
                    (message) => {

                        let data;

                        try {
                            data =
                                JSON.parse(
                                    message.data
                                );
                        }
                        catch (e) {
                            return;
                        }

                        if (
                            !Array.isArray(data)
                        ) {
                            return;
                        }

                        if (
                            data[0] === "EVENT" &&
                            data.length >= 3
                        ) {

                            const event =
                                data[2];

                            if (
                                event &&
                                typeof event.created_at === "number"
                            ) {
                                events.push(
                                    event
                                );
                            }
                        }
                        else if (
                            data[0] === "EOSE"
                        ) {
                            finish();
                        }
                    };

                socket.onerror =
                    () => {
                        finish();
                    };

                socket.onclose =
                    () => {
                        if (!finished) {
                            finish();
                        }
                    };

            }
            catch (e) {
                finish();
            }
        }
    );
}

// ============================================================
// NIP-65 Kind 10002取得
// ============================================================

async function fetchRelayList(
    pubkeyHex
)
{
    const results =
        await Promise.all(
            BOOTSTRAP_RELAYS.map(
                relay =>
                    queryEvent(
                        relay,
                        pubkeyHex,
                        10002
                    )
            )
        );

    let newestEvent = null;

    for (
        const event of results
    ) {
        if (!event) {
            continue;
        }

        if (
            newestEvent === null ||
            event.created_at >
            newestEvent.created_at
        ) {
            newestEvent =
                event;
        }
    }

    if (
        newestEvent === null
    ) {
        return [
            ...BOOTSTRAP_RELAYS
        ];
    }

    const relays = [];

    for (
        const tag of
        (
            newestEvent.tags || []
        )
    ) {

        if (
            !Array.isArray(tag) ||
            tag.length < 2 ||
            tag[0] !== "r"
        ) {
            continue;
        }

        const relay =
            tag[1];

        if (
            typeof relay !== "string" ||
            !relay.startsWith("wss://")
        ) {
            continue;
        }

        if (
            !relays.includes(relay)
        ) {
            relays.push(
                relay
            );
        }
    }

    if (
        relays.length === 0
    ) {
        return [
            ...BOOTSTRAP_RELAYS
        ];
    }

    return relays;
}

// ============================================================
// Kind 0プロフィール取得
// ============================================================

async function fetchProfile(
    pubkeyHex,
    relays
)
{
    const results =
        await Promise.all(
            relays.map(
                relay =>
                    queryEvent(
                        relay,
                        pubkeyHex,
                        0
                    )
            )
        );

    let newestEvent = null;

    for (
        const event of results
    ) {
        if (!event) {
            continue;
        }

        if (
            newestEvent === null ||
            event.created_at >
            newestEvent.created_at
        ) {
            newestEvent =
                event;
        }
    }

    if (
        newestEvent === null
    ) {
        throw new Error(
            "The Kind 0 profile could not be retrieved."
        );
    }

    let profile;

    try {
        profile =
            JSON.parse(
                newestEvent.content
            );
    }
    catch (e) {
        throw new Error(
            "The Kind 0 content could not be parsed as JSON."
        );
    }

    if (
        !profile ||
        typeof profile !== "object" ||
        Array.isArray(profile)
    ) {
        throw new Error(
            "The profile JSON has an invalid format."
        );
    }

    return {
        profile: profile,
        created_at: newestEvent.created_at
    };
}

// ============================================================
// created_at → ISO 8601
// ============================================================

function createdAtToIso8601(value)
{
    if (value === null || value === undefined || value === "") return "";
    const timestamp = Number(value);
    if (!Number.isFinite(timestamp)) return String(value);
    const date = new Date(timestamp * 1000);
    if (Number.isNaN(date.getTime())) return String(value);
    return date.toISOString();
}


// ============================================================
// プロフィール値 → 表示文字列
// ============================================================

function profileValueToString(
    key,
    value
)
{
    if (
        key === "created_at"
    ) {
        return createdAtToIso8601(value);
    }

    if (
        key === "nip05"
        &&
        typeof value === "string"
    ) {

        return displayNip05(
            value
        );
    }

    if (
        value === null ||
        value === undefined
    ) {

        return "";
    }

    if (
        typeof value === "object"
    ) {

        return JSON.stringify(
            value,
            null,
            2
        );
    }

    if (
        typeof value === "boolean"
    ) {

        return value
            ? "true"
            : "false";
    }

    return String(value);
}


// ============================================================
// プロフィール表示
//
// 優先表示:
//
// banner
// picture
// npub
// display_name
// name
// nip05
//
// それ以外:
//
// Kind 0 JSONに現れた順番
// ============================================================

function printProfile(
    profile,
    npub,
    createdAt
)
{
    const app =
        document.getElementById(
            "app"
        );

    let html =
        '<div class="profile">';

    html +=
        "<h1>Nostr Profile</h1>";


    /*
     * npubをプロフィールJSONとは別に
     * 仮想的な項目として追加
     */
    const values = {

        ...profile,

        npub: npub,

        created_at: createdAt

    };


    /*
     * 優先表示する項目
     */
    const priority = [

        "banner",

        "picture",

        "npub",

        "display_name",

        "name",

        "nip05",

        "created_at",

        "website"

    ];


    /*
     * すでに表示した項目
     */
    const displayed =
        new Set();


    // --------------------------------------------------------
    // 優先項目を表示
    // --------------------------------------------------------

    for (
        const key of priority
    ) {

        if (
            !Object.prototype.hasOwnProperty.call(
                values,
                key
            )
        ) {

            continue;
        }


        const rawValue =
            values[key];


        const value =
            profileValueToString(
                key,
                rawValue
            );


        /*
         * 値が空なら表示しない
         */

        if (
            value.trim() === ""
        ) {

            continue;
        }


        html +=
            createProfileRow(
                key,
                value
            );


        displayed.add(
            key
        );
    }


    // --------------------------------------------------------
    // 残りの項目を元の順番で表示
    // --------------------------------------------------------

    for (
        const [
            key,
            rawValue
        ]
        of Object.entries(profile)
    ) {

        /*
         * 優先表示済みならスキップ
         */

        if (
            displayed.has(key)
        ) {

            continue;
        }


        const value =
            profileValueToString(
                key,
                rawValue
            );


        /*
         * 空の項目は表示しない
         */

        if (
            value.trim() === ""
        ) {

            continue;
        }


        html +=
            createProfileRow(
                key,
                value
            );

    }


    html +=
        "</div>";


    app.innerHTML =
        html;
}


// ============================================================
// プロフィール1行生成
// ============================================================

function createProfileRow(
    key,
    value
)
{
    /*
     * banner
     */

    if (
        key === "banner"
    ) {

        return (

            '<div class="profile-row">' +

            '<div class="profile-key">' +
            escapeHtml(key) +
            '</div>' +

            '<div class="profile-value">' +

            '<img class="profile-banner" ' +

            'src="' +
            escapeHtml(value) +
            '" ' +

            'alt="banner" ' +

            'onerror="this.style.display=\'none\'">' +

            '</div>' +

            '</div>'

        );
    }


    /*
     * picture
     */

    if (
        key === "picture"
    ) {

        return (

            '<div class="profile-row">' +

            '<div class="profile-key">' +
            escapeHtml(key) +
            '</div>' +

            '<div class="profile-value">' +

            '<img class="profile-picture" ' +

            'src="' +
            escapeHtml(value) +
            '" ' +

            'alt="picture" ' +

            'onerror="this.style.display=\'none\'">' +

            '</div>' +

            '</div>'

        );
    }


    /*
     * 通常の項目
     */

    return (

        '<div class="profile-row">' +

        '<div class="profile-key">' +
        escapeHtml(key) +
        '</div>' +

        '<div class="profile-value">' +
        escapeHtml(value) +
        '</div>' +

        '</div>'

    );
}


// ============================================================
// Error表示
// ============================================================

function printError(message)
{
    const app =
        document.getElementById(
            "app"
        );

    app.innerHTML =
        '<div class="error">' +

        "<h1>Error</h1>" +

        "<p>" +
        escapeHtml(message) +
        "</p>" +

        "</div>";
}


// ============================================================
// メイン処理
// ============================================================

async function main()
{
    try {

        const params =
            new URLSearchParams(
                window.location.search
            );

        const input =
            params.get("id");

        if (
            input === null
            ||
            input.trim() === ""
        ) {

            throw new Error(
                "The id parameter is not specified."
            );
        }


        /*
         * NIP-05
         *
         * ↓
         *
         * 公開鍵HEX
         */

        const result =
            await nip05ToHexPubkey(
                input
            );


        const pubkeyHex =
            result.pubkey;


        /*
         * HEX
         *
         * ↓
         *
         * npub
         */

        const npub =
            hexToNpub(
                pubkeyHex
            );


        /*
         * NIP-65
         */

        const relays =
            await fetchRelayList(
                pubkeyHex
            );


        /*
         * Kind 0
         */

        const profileResult =
            await fetchProfile(
                pubkeyHex,
                relays
            );

        const profile =
            profileResult.profile;

        const profileEventCreatedAt =
            profileResult.created_at;


        /*
         * 表示
         */

        printProfile(
            profile,
            npub,
            profileEventCreatedAt
        );

    }
    catch (error) {

        console.error(
            error
        );

        printError(
            error.message
        );
    }
}


// ============================================================
// 実行
// ============================================================

main();

</script>

</body>

</html>
